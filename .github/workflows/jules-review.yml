name: Jules Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  jules-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Invoke Jules for Review
        uses: google-labs-code/jules-invoke@main
        with:
          # Jules에게 시킬 구체적인 리뷰 명령
          prompt: "이 PR의 변경 사항을 검토하고 성능 개선이나 보안 취약점이 있는지 리뷰해줘."
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}